<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BACKED | Sign In</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Login-specific styles */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      margin-top: 80px;
      padding: 20px;
    }
    
    .login-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 5px 25px var(--shadow);
      width: 100%;
      max-width: 460px;
      padding: 40px;
      text-align: center;
    }
    
    .login-card h1 {
      font-size: 2rem;
      color: var(--primary-blue);
      margin-bottom: 24px;
    }
    
    .social-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .social-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--medium-gray);
      background-color: var(--card-bg);
      color: var(--text);
      transition: all 0.3s ease;
    }
    
    .social-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 12px var(--shadow);
      border-color: var(--primary-blue);
    }
    
    .social-button svg {
      width: 24px;
      height: 24px;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--text);
      font-size: 0.9rem;
    }
    
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--medium-gray);
    }
    
    .divider::before {
      margin-right: 16px;
    }
    
    .divider::after {
      margin-left: 16px;
    }
    
    .login-form {
      text-align: left;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--medium-gray);
      border-radius: 8px;
      font-size: 1rem;
      background-color: var(--card-bg);
      color: var(--text);
      transition: all 0.3s ease;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 2px rgba(0, 72, 120, 0.1);
    }
    
    .forgot-password {
      display: block;
      text-align: right;
      margin-bottom: 24px;
      color: var(--primary-blue);
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    .forgot-password:hover {
      color: var(--primary-red);
    }
    
    .signin-button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-red);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }
    
    .signin-button:hover {
      background-color: #b71c1c;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .signup-link {
      font-size: 0.9rem;
      color: var(--text);
    }
    
    .signup-link a {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    
    .signup-link a:hover {
      color: var(--primary-red);
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-follower"></div>
  
  <header>
    <div class="logo">
      <a href="index.html">
        <img src="logo2.png" alt="BACKED Logo">
        <span class="capital-one">by Capital One</span>
      </a>
    </div>
    <nav>
      <a href="featured-opportunities.html" class="nav-link">Featured Opportunities</a>
      <a href="about.html" class="nav-link">About Us</a>
      <div class="toggle-container">
        <button id="cursor-toggle" class="toggle-button" title="Toggle Cursor Effect">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 13L20 6M17.5 6H20V8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11 11L4 18M6.5 18H4V15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="theme-toggle" class="toggle-button" title="Toggle Dark Mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="sun-icon">
            <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 20V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 12L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M22 12L20 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19.7778 4.22266L17.5558 6.25424" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4.22217 4.22266L6.44418 6.25424" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6.44434 17.5557L4.22211 19.7779" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19.7778 19.7773L17.5558 17.5551" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="moon-icon">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <a href="login.html" class="nav-link active">Sign In</a>
      <a href="signup.html" class="btn-primary">Get Started</a>
    </nav>
  </header>

  <div class="login-container">
    <div class="login-card">
      <h1>Sign In</h1>
      
      <div class="social-buttons">
        <a href="#" class="social-button" aria-label="Sign in with Google">
          <!-- Google "G" Logo -->
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </a>
        <a href="#" class="social-button" aria-label="Sign in with GitHub">
          <!-- GitHub Logo -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0012 2z"/>
          </svg>
        </a>
        <a href="#" class="social-button" aria-label="Sign in with LinkedIn">
          <!-- LinkedIn Logo -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
          </svg>
        </a>
      </div>
      
      <div class="divider">or use your account</div>
      
      <form class="login-form">
        <div class="form-group">
          <input type="email" id="email" name="email" placeholder="Email" required>
        </div>
        
        <div class="form-group">
          <input type="password" id="password" name="password" placeholder="Password" required>
        </div>
        
        <a href="#" class="forgot-password">Forgot your password?</a>
        
        <button type="submit" class="signin-button">Sign In</button>
        
        <div class="signup-link">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Custom cursor functionality
      const cursor = document.querySelector('.cursor');
      const cursorFollower = document.querySelector('.cursor-follower');
      let cursorEnabled = true;
      
      function updateCursor(e) {
        if (!cursorEnabled) return;
        
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        
        setTimeout(function() {
          cursorFollower.style.left = e.clientX + 'px';
          cursorFollower.style.top = e.clientY + 'px';
        }, 100);
      }
      
      document.addEventListener('mousemove', updateCursor);
      
      const links = document.querySelectorAll('a, button, input');
      links.forEach(link => {
        link.addEventListener('mouseenter', () => {
          if (!cursorEnabled) return;
          cursor.classList.add('cursor-hover');
          cursorFollower.classList.add('cursor-follower-hover');
        });
        link.addEventListener('mouseleave', () => {
          if (!cursorEnabled) return;
          cursor.classList.remove('cursor-hover');
          cursorFollower.classList.remove('cursor-follower-hover');
        });
      });
      
      // Cursor toggle
      const cursorToggle = document.getElementById('cursor-toggle');
      cursorToggle.addEventListener('click', () => {
        cursorEnabled = !cursorEnabled;
        document.body.classList.toggle('cursor-disabled');
        if (!cursorEnabled) {
          cursor.style.display = 'none';
          cursorFollower.style.display = 'none';
        } else {
          cursor.style.display = 'block';
          cursorFollower.style.display = 'block';
        }
      });
      
      // Theme toggle
      const themeToggle = document.getElementById('theme-toggle');
      themeToggle.addEventListener('click', () => {
        document.documentElement.setAttribute('data-theme', 
          document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
        );
      });
    });
  </script>
</body>
</html>
